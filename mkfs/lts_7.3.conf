# V5 features that were the mkfs defaults when the upstream Linux 7.3 LTS
# kernel was released at the end of 2026.
[block]

[metadata]
crc=1
finobt=1
rmapbt=1
reflink=1
inobtcount=1
bigtime=1
metadir=0
autofsck=repair

[data]

[inode]
sparse=1
nrext64=1
exchange=1

[log]

[naming]
parent=1
ftype=1
version=2

[realtime]
